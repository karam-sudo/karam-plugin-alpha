name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write
  packages: write

jobs:
  quality:
    uses: karam-sudo/karam-monorepo/.github/workflows/quality-plugin.yaml@main
    with:
      plugin_name: plugin-alpha
    secrets:
      GH_ACTION_TOKEN: ${{ secrets.GH_ACTION_TOKEN }}

  pr-title:
    if: github.event_name == 'pull_request'
    uses: karam-sudo/karam-monorepo/.github/workflows/pr-title-plugin.yaml@main

  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    uses: karam-sudo/karam-monorepo/.github/workflows/build-api-plugin.yaml@main
    with:
      plugin_name: plugin-alpha
      docker_registry: ghcr.io
    secrets:
      GH_ACTION_TOKEN: ${{ secrets.GH_ACTION_TOKEN }}
